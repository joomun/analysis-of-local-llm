<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LLM Monitor Home</title>
    <link rel="stylesheet" href="style.css">
    <!-- Set theme before first paint -->
    <script>
      (function(){ try{ var saved=localStorage.getItem('dashboard-theme'); var theme=(saved==='light'||saved==='dark')?saved:((window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark'); document.documentElement.setAttribute('data-theme',theme);} catch(e){ document.documentElement.setAttribute('data-theme','dark'); }})();
    </script>
</head>
<body>
<div class="shell">
  <section class="terminal" aria-label="LLM performance monitor">
    <header class="terminal-bar">
      <div id="connStatus" class="terminal-status" role="status"><span class="status-dot"></span><span id="statusText">connecting</span></div>
      <div class="dots"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>
      <div class="terminal-title"><span class="path">joomun@portfolio:~$</span> <span class="cmd">llm-monitor</span></div>
    </header>

    <div class="terminal-body" style="text-align:center;padding-top:40px;">
      <h1>Welcome to LLM Monitor</h1>
      <p>View the full dashboard for detailed metrics.</p>
      <a href="/dashboard.html" class="btn btn-primary">Open Dashboard</a>
    </div>

    <!-- Active Models List -->
    <div id="activeModels" style="margin-top:20px;">
      <h2>Active Model(s)</h2>
      <ul id="modelsList"></ul>
    </div>
<div id="lastUpdated" class="last-updated">—</div>

    <footer class="terminal-foot">
        <span>LLM Performance Monitor</span>
        <span class="sep">·</span>
        <span>parsing LM Studio logs in real time</span>
    </footer>
  </section>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // Update connection status
  const connStatusEl = document.getElementById('connStatus');
  const statusTextEl = document.getElementById('statusText');
  fetch('/api/health')
    .then(r=>r.json())
    .then(d=>{ if(d.ok){ connStatusEl.classList.add('online'); statusTextEl.textContent='online'; } else { connStatusEl.classList.add('offline'); statusTextEl.textContent='offline'; } })
    .catch(()=>{ connStatusEl.classList.add('offline'); statusTextEl.textContent='offline'; });

  // Update last updated timestamp
  const lastUpdatedEl = document.getElementById('lastUpdated');
  if(lastUpdatedEl){ lastUpdatedEl.textContent=`updated ${new Date().toLocaleTimeString()}`; }

  fetch('/api/active-models')
  fetch('/api/active-models')
    .then(r=>r.json())
    .then(d=>{
      const ul = document.getElementById('modelsList');
      if (!d.models || !d.models.length) { ul.textContent='None'; return; }
      d.models.forEach(m=>{
        const li=document.createElement('li');
        li.textContent=`${m.name} (loaded ${new Date(m.loadedAt).toLocaleString()})`;
        ul.appendChild(li);
      });
    })
    .catch(e=>{ console.error(e); });
});
</script>

</body>
</html>
